name: 4-Channel Media Empire Autopilot V11.0

on:
  schedule:
    # مواعيد الذروة اليومية الموزعة للقنوات الأربع (حلقة كاملة >15 دقيقة + غلاف ناري + شورتين يومياً لكل قناة)
    - cron: '15 16 * * *'   # 6:15 مساءً القاهرة — دفتر راوي
    - cron: '15 18 * * *'   # 8:15 مساءً القاهرة — الدليل الأخير
    - cron: '15 21 * * *'   # 11:15 مساءً القاهرة — Velvet Tales (US Prime)
    - cron: '45 23 * * *'   # 1:45 فجراً القاهرة — Mindlock (US Late Prime)
  workflow_dispatch:
    inputs:
      channel_id:
        description: 'معرف القناة للتشغيل اليدوي الفوري'
        required: true
        default: 'ch1_eg_thriller'
        type: choice
        options:
          - ch1_eg_thriller
          - ch2_eg_mystery
          - ch3_en_thriller
          - ch4_en_mystery
          - all

concurrency:
  group: empire-v10-${{ github.event.inputs.channel_id || github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 & FFmpeg Subtitles Engine
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libass-dev libraqm0 fonts-hosny-amiri
          pip install -q -r requirements.txt

      - name: Select target channel from schedule or manual input
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "channel=${{ github.event.inputs.channel_id }}" >> $GITHUB_OUTPUT
          else
            case "${{ github.event.schedule }}" in
              "15 16 * * *") echo "channel=ch1_eg_thriller" >> $GITHUB_OUTPUT ;;
              "15 18 * * *") echo "channel=ch2_eg_mystery" >> $GITHUB_OUTPUT ;;
              "15 21 * * *") echo "channel=ch3_en_thriller" >> $GITHUB_OUTPUT ;;
              "45 23 * * *") echo "channel=ch4_en_mystery" >> $GITHUB_OUTPUT ;;
              *) echo "channel=ch1_eg_thriller" >> $GITHUB_OUTPUT ;;
            esac
          fi

      - name: Produce 16-min 8s-Shot FLUX Movie + High-CTR Thumbnail + 2 Shorts & Publish
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TOKEN_2: ${{ secrets.HF_TOKEN_2 }}
          HF_TOKEN_3: ${{ secrets.HF_TOKEN_3 }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CH1_ZERNIO_KEY: ${{ secrets.CH1_ZERNIO_KEY }}
          CH1_TIKTOK_ZERNIO_KEY: ${{ secrets.CH1_TIKTOK_ZERNIO_KEY }}
          CH1_TIKTOK_ACCOUNT_ID: ${{ secrets.CH1_TIKTOK_ACCOUNT_ID }}
          CH2_ZERNIO_KEY: ${{ secrets.CH2_ZERNIO_KEY }}
          CH2_TIKTOK_ZERNIO_KEY: ${{ secrets.CH2_TIKTOK_ZERNIO_KEY }}
          CH2_TIKTOK_ACCOUNT_ID: ${{ secrets.CH2_TIKTOK_ACCOUNT_ID }}
          CH3_ZERNIO_KEY: ${{ secrets.CH3_ZERNIO_KEY }}
          CH3_TIKTOK_ZERNIO_KEY: ${{ secrets.CH3_TIKTOK_ZERNIO_KEY }}
          CH3_TIKTOK_ACCOUNT_ID: ${{ secrets.CH3_TIKTOK_ACCOUNT_ID }}
          CH4_ZERNIO_KEY: ${{ secrets.CH4_ZERNIO_KEY }}
          CH4_TIKTOK_ZERNIO_KEY: ${{ secrets.CH4_TIKTOK_ZERNIO_KEY }}
          CH4_TIKTOK_ACCOUNT_ID: ${{ secrets.CH4_TIKTOK_ACCOUNT_ID }}
        run: |
          python -u run_empire.py --channel "${{ steps.target.outputs.channel }}"

      - name: Save Non-Repetition Memory Back to Repository
        run: |
          git config user.name "empire-autopilot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/empire_memory.json
          git diff --staged --quiet || (git commit -m "chore: save episode memory [skip ci]" && git pull --rebase -X ours origin main && git push origin main)
