name: 4-Channel Media Empire Autopilot V16.0 (AI Video Growth Director + Zero-Miss Scheduler)

on:
  schedule:
    # 8 مسحات يومية موزعة خارج أوقات الزحام للتحضير المبكر وقفل الموعد الرسمي بالثانية داخل سحابة Zernio + دورة المدير الذكي الذاتي:
    # - 16:15 UTC (6:15م القاهرة — دفتر راوي)
    # - 18:15 UTC (8:15م القاهرة — الدليل الأخير)
    # - 21:15 UTC (11:15م القاهرة — Velvet Tales)
    # - 23:45 UTC (1:45ص القاهرة — Mindlock)
    - cron: '25 4 * * *'
    - cron: '55 6 * * *'
    - cron: '25 9 * * *'
    - cron: '55 11 * * *'
    - cron: '35 14 * * *'
    - cron: '25 17 * * *'
    - cron: '15 20 * * *'
    - cron: '05 23 * * *'
  workflow_dispatch:
    inputs:
      channel_id:
        description: 'معرف القناة للتشغيل اليدوي الفوري أو catchup-all أو smart-sync أو director-only'
        required: true
        default: 'smart-sync'
        type: choice
        options:
          - smart-sync
          - catchup-all
          - director-only
          - ch1_eg_thriller
          - ch2_eg_mystery
          - ch3_en_thriller
          - ch4_en_mystery
          - all

concurrency:
  group: empire-v14-global-production
  cancel-in-progress: false

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 & FFmpeg Subtitles Engine
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libass-dev libraqm0 fonts-hosny-amiri
          pip install -q --upgrade -r requirements.txt

      - name: Select target mode
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "channel=${{ github.event.inputs.channel_id }}" >> $GITHUB_OUTPUT
          else
            echo "channel=smart-sync" >> $GITHUB_OUTPUT
          fi

      - name: Produce 16-min Movie + Universal Covers + 4 Shorts & Lock/Publish via Zernio
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TOKEN_2: ${{ secrets.HF_TOKEN_2 }}
          HF_TOKEN_3: ${{ secrets.HF_TOKEN_3 }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CH1_ZERNIO_KEY: ${{ secrets.CH1_ZERNIO_KEY }}
          CH1_TIKTOK_ZERNIO_KEY: ${{ secrets.CH1_TIKTOK_ZERNIO_KEY }}
          CH1_TIKTOK_ACCOUNT_ID: ${{ secrets.CH1_TIKTOK_ACCOUNT_ID }}
          CH2_ZERNIO_KEY: ${{ secrets.CH2_ZERNIO_KEY }}
          CH2_TIKTOK_ZERNIO_KEY: ${{ secrets.CH2_TIKTOK_ZERNIO_KEY }}
          CH2_TIKTOK_ACCOUNT_ID: ${{ secrets.CH2_TIKTOK_ACCOUNT_ID }}
          CH3_ZERNIO_KEY: ${{ secrets.CH3_ZERNIO_KEY }}
          CH3_TIKTOK_ZERNIO_KEY: ${{ secrets.CH3_TIKTOK_ZERNIO_KEY }}
          CH3_TIKTOK_ACCOUNT_ID: ${{ secrets.CH3_TIKTOK_ACCOUNT_ID }}
          CH4_ZERNIO_KEY: ${{ secrets.CH4_ZERNIO_KEY }}
          CH4_TIKTOK_ZERNIO_KEY: ${{ secrets.CH4_TIKTOK_ZERNIO_KEY }}
          CH4_TIKTOK_ACCOUNT_ID: ${{ secrets.CH4_TIKTOK_ACCOUNT_ID }}
        run: |
          python -u run_empire.py --channel "${{ steps.target.outputs.channel }}"

      - name: Save Episode Memory, AI Director & Per-Video Growth Ledgers (Race-Safe Retry)
        if: always()
        run: |
          git config user.name "empire-autopilot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync episode memory & AI director analytics"
            for attempt in 1 2 3 4 5; do
              git pull --rebase -X theirs origin main && git push origin main && break
              echo "Git push retry $attempt..."
              sleep $((attempt * 4))
            done
          fi
