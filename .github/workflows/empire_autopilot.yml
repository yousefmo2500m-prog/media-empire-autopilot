name: Autonomous 4-Channel Viral Shorts Empire

on:
  schedule:
    # نشر يومي منتظم على مدار السنتين لجميع القنوات الأربع
    - cron: '15 11 * * *'   # 01:15 ظهراً بتوقيت القاهرة: القناة المصرية (CH1) + القناة الإنجليزية (CH2)
    - cron: '15 18 * * *'   # 08:15 مساءً بتوقيت القاهرة: القناة المصرية الثانية (CH3) + القناة الإنجليزية الثانية (CH4)
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to run (all, ch1_eg_karma, ch2_en_karma, ch3_eg_twists, ch4_en_workplace)'
        required: true
        default: 'all'

permissions:
  contents: write

concurrency:
  group: viral-shorts-empire
  cancel-in-progress: false

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12 & Node.js
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Select Scheduled Channels
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "targets=${{ inputs.channel }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "15 11 * * *" ]; then
            echo "targets=ch1_eg_karma ch2_en_karma" >> $GITHUB_OUTPUT
          else
            echo "targets=ch3_eg_twists ch4_en_workplace" >> $GITHUB_OUTPUT
          fi

      - name: Produce & Publish Viral Shorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CH1_ZERNIO_KEY: ${{ secrets.CH1_ZERNIO_KEY }}
          CH2_ZERNIO_KEY: ${{ secrets.CH2_ZERNIO_KEY }}
          CH3_ZERNIO_KEY: ${{ secrets.CH3_ZERNIO_KEY }}
          CH4_ZERNIO_KEY: ${{ secrets.CH4_ZERNIO_KEY }}
          AFFILIATE_COMMENT_FOOTER: ${{ secrets.AFFILIATE_COMMENT_FOOTER }}
        run: |
          for ch in ${{ steps.pick.outputs.targets }}; do
            python run_empire.py --channel "$ch" --publish --out-dir /tmp/empire_out
          done

      - name: Persist 2-Year Story History
        run: |
          git config user.name "MediaEmpire Bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/empire_memory.json
          if ! git diff --cached --quiet; then
            git pull --rebase origin main || true
            git add state/empire_memory.json
            git commit -m "chore(memory): save published story topics [skip ci]"
            git push origin HEAD:main
          fi
